<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | VARSHA KRITRIMA BUDHHIH</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <div class="page-shell compact-shell">
    <header class="topbar">
      <a class="brand" href="index.html"><img src="logo-icon.png" alt="Logo"><span class="brand-text">VARSHA <strong>KRITRIMA BUDHHIH</strong></span></a>
      <span class="tagline">Predict. Protect. Prevent.</span>
    </header>
    <main class="single-layout centered-layout">
      <section class="card reset-card">
        <img class="login-logo" src="logo-icon.png" alt="Project logo">
        <div class="eyebrow">ACCOUNT RECOVERY</div>
        <h2>Reset Password</h2>
        <p class="card-subtitle">Enter your registered email and choose a new password.</p>
        <form onsubmit="resetPassword(event)">
          <label class="field"><span>✉</span><input id="resetEmail" type="email" placeholder="Registered Email" required></label>
          <label class="field"><span>🔒</span><input id="newPassword" type="password" placeholder="New Password" required minlength="6"></label>
          <label class="field"><span>🔐</span><input id="confirmNewPassword" type="password" placeholder="Confirm New Password" required minlength="6"></label>
          <button type="submit">RESET PASSWORD <span>→</span></button>
        </form>
        <p class="signup"><a href="index.html">← Back to Login</a></p>
        <p class="demo-note">Frontend-only demo: no email is sent. The password is updated in this browser's local storage until a real backend is connected.</p>
      </section>
    </main>
  </div>
  <script src="script.js"></script>
</body>
</html>
